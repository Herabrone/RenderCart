name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rendercart-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    # Install a GitHub Actions runner on the always-on RenderCart host and label
    # it `rendercart`. Deploys run only for trusted pushes to main.
    runs-on: [self-hosted, linux, x64, rendercart]
    environment: production
    timeout-minutes: 45
    env:
      RENDERCART_ENV_FILE: /home/darian/.config/rendercart/.env
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Validate production configuration
        run: |
          set -eu
          test -f "$RENDERCART_ENV_FILE"
          test -r "$RENDERCART_ENV_FILE"
          test -s "$RENDERCART_ENV_FILE"

      - name: Build and migrate database
        run: |
          set -eu
          ln -sfn "$RENDERCART_ENV_FILE" .env
          docker compose -f infra/compose.yml config --quiet
          docker compose -f infra/compose.yml build
          docker compose -f infra/compose.yml run --rm api alembic upgrade head

      - name: Start production stack
        run: |
          set -eu
          docker compose -f infra/compose.yml up -d --remove-orphans
          docker compose -f infra/compose.yml ps
