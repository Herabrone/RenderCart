name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: image-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt -r worker/requirements.txt -r requirements-dev.txt
      - name: Ruff
        run: ruff check ../tests api worker
      - name: Pytest
        run: pytest ../tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: image-service/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: image-service/ui/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Node tests
        run: npm run test
