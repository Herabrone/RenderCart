    description: "Amazon-style white background preset for compliant product listings."
  social_square:
    id: social_square
    display_name: Social Square
    prompt_template: "{user_prompt}, {use_case}, {product_category}, {brand_style}, modern social media square format, bold contrast, share-ready"
    inference_kwargs:
      num_inference_steps: 26
      guidance_scale: 6.5
      strength: 0.6
    output_format: social_square
    description: "Social media square preset for Instagram and feed posts."
  social_portrait:
    id: social_portrait
    display_name: Social Portrait
    prompt_template: "{user_prompt}, {use_case}, {product_category}, {brand_style}, portrait-oriented social format, eye-catching vertical layout"
    inference_kwargs:
      num_inference_steps: 26
      guidance_scale: 6.5
      strength: 0.6
    output_format: social_portrait
    description: "Social portrait preset for stories and vertical marketing creatives."
